name: Deploy Pages

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "data/dashboard.json"
      - "data/index.json"
      - "data/nsf/**"
      - "data/nih/**"
      - "data/sentinel/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate before deploy
        # This workflow is path-triggered off main with no dependency on the
        # Test workflow, so a direct push could otherwise deploy unvalidated
        # content. Re-run the offline gates here; they cost about a minute.
        # The fast tier (docs/verification-regime.md) is a strict superset
        # of this job's previous five checks -- same unit suite, same
        # --allow-empty obligation ledger contract, plus verify_dms_baseline
        # and validate_award_invariants for free, from the one verifier
        # every worker and CI job runs.
        run: python scripts/verify.py --tier fast --json _verify-fast.json
      - name: Assemble site
        run: |
          mkdir -p _site
          cp site/index.html _site/
          cp -r data _site/data
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
