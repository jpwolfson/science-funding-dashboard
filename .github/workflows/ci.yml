name: Test

on:
  push:
    branches: [main, "claude/**", "codex/**"]
    paths:
      - "adapters/**"
      - "scripts/**"
      - "tests/**"
      - "config/orgs.json"
      - "config/obligation_accounts.json"
      - "config/funding_sentinel.json"
      - "data/sentinel/**"
      - "reference/nih_databook_baseline.json"
      - "reference/usaspending_calibration.json"
      - "reference/*_obligation_baseline.json"
      - "site/index.html"
      - ".github/workflows/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python and validate registry JSON
        run: |
          python -m compileall -q adapters scripts tests
          python -m json.tool config/orgs.json >/dev/null
          python -m json.tool config/obligation_accounts.json >/dev/null
          python -m json.tool config/funding_sentinel.json >/dev/null
          python -m json.tool reference/nih_databook_baseline.json >/dev/null
          python -m json.tool reference/usaspending_calibration.json >/dev/null
          python -c "
          import json
          config = json.load(open('config/obligation_accounts.json'))
          for account in config['accounts']:
              json.load(open(account['baseline']))
          print(f'{len(config[\"accounts\"])} obligation baseline(s) OK')
          "
      # Single source of truth (docs/verification-regime.md): every offline
      # check below is scripts/verify.py's own tiers, the same command a
      # worker or the coordinator runs locally, so this list cannot drift
      # from what agents run before opening a PR.
      - name: Verify — registry tier (pre-backfill registry/baseline lint)
        run: python scripts/verify.py --tier registry
      - name: Verify — fast tier (unit tests + full offline validator suite)
        run: python scripts/verify.py --tier fast --json _verify-fast.json
      - name: Verify — rendered tier (obligation, all-accounts, and sentinel browser matrices)
        run: python scripts/verify.py --tier rendered --json _verify-rendered.json
      - name: Retain verification JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-reports
          path: _verify-*.json
          if-no-files-found: ignore
          retention-days: 14
