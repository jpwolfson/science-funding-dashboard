name: Test

on:
  push:
    branches: [main, "claude/**", "codex/**"]
    paths:
      - "adapters/**"
      - "scripts/**"
      - "tests/**"
      - "config/orgs.json"
      - "config/obligation_accounts.json"
      - "config/funding_sentinel.json"
      - "data/sentinel/**"
      - "reference/nih_databook_baseline.json"
      - "reference/usaspending_calibration.json"
      - "reference/*_obligation_baseline.json"
      - "site/index.html"
      - ".github/workflows/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python and validate registry JSON
        run: |
          python -m compileall -q adapters scripts tests
          python -m json.tool config/orgs.json >/dev/null
          python -m json.tool config/obligation_accounts.json >/dev/null
          python -m json.tool config/funding_sentinel.json >/dev/null
          python -m json.tool reference/nih_databook_baseline.json >/dev/null
          python -m json.tool reference/usaspending_calibration.json >/dev/null
          python -m json.tool reference/doe_sc_obligation_baseline.json >/dev/null
      - name: Offline NIH data integrity and external benchmark checks
        run: python scripts/validate_nih.py
      - name: USAspending calibration and onboarding gate
        run: python scripts/validate_usaspending_calibration.py
      - name: Obligation ledger contract (data backfills in its dedicated workflow)
        run: python scripts/validate_obligations.py --allow-empty
      - name: Funding-action sentinel and source-pilot contract
        run: python scripts/validate_funding_sentinel.py
      - name: Rendered obligation page matrix
        run: python scripts/smoke_obligation_pages.py
      - name: Rendered funding-action sentinel matrix
        run: python scripts/smoke_sentinel_page.py
