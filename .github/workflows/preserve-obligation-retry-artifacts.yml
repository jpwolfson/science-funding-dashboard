name: Preserve conflicting obligation retry artifacts

on:
  workflow_dispatch:
    inputs:
      manifest_json:
        description: Exact schema-v1 obligation retry-artifact manifest
        required: true
        type: string
  push:
    branches: ["agent/3-2d-retry-artifact-operation"]
    paths: [".github/triggers/preserve-obligation-retry-artifacts.json"]

permissions:
  actions: write
  contents: write

concurrency:
  group: obligation-retry-artifact-recovery
  cancel-in-progress: false

jobs:
  preserve-then-delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize the exact deletion manifest
        env:
          DISPATCH_MANIFEST: ${{ inputs.manifest_json }}
        shell: python
        run: |
          import os
          from pathlib import Path

          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              value = os.environ["DISPATCH_MANIFEST"]
          else:
              value = Path(
                  ".github/triggers/preserve-obligation-retry-artifacts.json"
              ).read_text()
          Path("_retry-artifact-manifest.json").write_text(value)
      - name: Validate, download, and hash every source ZIP
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(python -c 'import json; print(json.load(open("_retry-artifact-manifest.json"))["runId"])')
          python scripts/manage_workflow_retry_artifacts.py preserve \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$RUN_ID" \
            --manifest _retry-artifact-manifest.json \
            --output _preserved
      - name: Retain the verified source ZIPs before remote deletion
        uses: actions/upload-artifact@v4
        with:
          name: obligation-retry-source-preservation-${{ github.run_id }}
          path: _preserved
          if-no-files-found: error
          retention-days: 14
      - name: Commit the exact preservation bundle to the operational branch
        if: github.event_name == 'push'
        env:
          BRANCH: ${{ github.ref_name }}
        shell: python
        run: |
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          if os.environ["BRANCH"] != "agent/3-2d-retry-artifact-operation":
              raise SystemExit("refusing to persist evidence outside the operational branch")
          record = json.load(open("_preserved/preservation.json"))
          target = Path("reference/obligation-retry-evidence") / str(record["runId"])
          if target.exists():
              raise SystemExit(f"evidence path already exists: {target}")
          shutil.copytree("_preserved", target)
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run([
              "git", "config", "user.email",
              "41898282+github-actions[bot]@users.noreply.github.com",
          ], check=True)
          subprocess.run(["git", "add", str(target)], check=True)
          subprocess.run([
              "git", "commit", "-m",
              "Preserve obligation retry source evidence [skip ci]",
          ], check=True)
          subprocess.run([
              "git", "push", "origin", f"HEAD:{os.environ['BRANCH']}",
          ], check=True)
          print("Evidence commit " + subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip())
      - name: Delete only the exact preserved conflicting artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(python -c 'import json; print(json.load(open("_preserved/preservation.json"))["runId"])')
          python scripts/manage_workflow_retry_artifacts.py delete \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$RUN_ID" \
            --manifest _preserved/preservation.json
