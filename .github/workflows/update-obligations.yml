name: Update obligation ledger

on:
  schedule:
    - cron: "37 10 * * 1" # Weekly; every account current FY + one historical FY
  workflow_dispatch:
    inputs:
      mode:
        description: Refresh plan
        type: choice
        options: [weekly, full, custom]
        default: weekly
      accounts:
        description: "Comma-separated account paths/prefixes or 'all'"
        default: "all"
      from_fy:
        description: First FY (custom mode only)
        required: false
      to_fy:
        description: Last FY (custom mode only)
        required: false
      current_period:
        description: Final FY period (custom mode only)
        required: false
  push:
    # Phase 3.2d's coordinator protocol assigns workers agent/3-2d-* branches.
    branches: ["codex/**", "claude/**", "agent/**"]
    paths: [".github/triggers/update-obligations.json"]

permissions:
  contents: write

concurrency:
  group: obligation-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: plan
        name: Plan account × fiscal-year matrix from the registry
        shell: python
        run: |
          import json, os, subprocess

          event = os.environ["GITHUB_EVENT_NAME"]
          values = {}
          if event == "workflow_dispatch":
              values = json.load(open(os.environ["GITHUB_EVENT_PATH"])).get("inputs") or {}
          elif event == "push":
              values = json.load(open(".github/triggers/update-obligations.json"))
          mode = values.get("mode") or "weekly"
          accounts = values.get("accounts") or "all"
          command = ["python", "scripts/plan_obligation_refresh.py",
                     "--mode", mode, "--accounts", accounts]
          for option, key in (("--from-fy", "from_fy"), ("--to-fy", "to_fy"),
                              ("--current-period", "current_period")):
              if values.get(key) not in (None, ""):
                  command.extend([option, str(values[key])])
          matrix = subprocess.check_output(command, text=True).strip()
          print(matrix)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + matrix + "\n")

  pull-account-year:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # The custom-account generator drops bursty connections. Serialize all
      # registry entries as well as requests within an account-year pull.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute the previous attempt number for automatic resume
        id: previous_attempt
        if: ${{ github.run_attempt > 1 }}
        run: echo "value=$(( ${{ github.run_attempt }} - 1 ))" >> "$GITHUB_OUTPUT"
      - name: Download the previous attempt's raw artifact for automatic resume
        # A rerun of a failed matrix job shares one workflow run with a
        # higher attempt number. If the previous attempt's account-year
        # download timed out inside the adapter's 2 h cap, it wrote an
        # exact resume handoff into that attempt's raw-artifact upload
        # (see docs/obligation-ledger.md, "Persistence and corrections").
        # Staging it at _raw_previous lets pull_obligation_account.py
        # resume the same accepted request instead of submitting a
        # duplicate download that is likely to hit the same cap again.
        # continue-on-error: true because there may be no such artifact --
        # a first attempt, one that never reached the timeout handoff, or
        # one that finished cleanly all leave nothing to download.
        if: ${{ github.run_attempt > 1 }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: obligation-raw-${{ matrix.artifact }}-FY${{ matrix.fiscalYear }}-attempt${{ steps.previous_attempt.outputs.value }}
          path: _raw_previous
      - name: Pull ${{ matrix.account }} FY${{ matrix.fiscalYear }} through P${{ matrix.period }}
        run: |
          python scripts/pull_obligation_account.py \
            --account "${{ matrix.account }}" \
            --from-fy "${{ matrix.fiscalYear }}" \
            --to-fy "${{ matrix.fiscalYear }}" \
            --current-period "${{ matrix.period }}" \
            --raw-archive-dir _raw \
            --partition-output _partition \
            --no-rollup
      - name: Retain normalized account-year artifact for reconciliation
        uses: actions/upload-artifact@v4
        with:
          name: obligation-partition-${{ matrix.artifact }}-FY${{ matrix.fiscalYear }}
          path: _partition
          if-no-files-found: error
          # A 100-account-year Phase 3.2d matrix is serialized and can take
          # longer than one day. Early partitions must still exist when the
          # final reconcile job downloads the complete atomic candidate.
          retention-days: 7
      - name: Retain raw source ZIPs for bounded audit/debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Failed-job reruns share one workflow run with attempt 1. Include
          # the attempt so a retry can retain its new raw audit evidence
          # without colliding with an earlier artifact of the same account/FY.
          name: obligation-raw-${{ matrix.artifact }}-FY${{ matrix.fiscalYear }}-attempt${{ github.run_attempt }}
          path: _raw
          if-no-files-found: warn
          retention-days: 14

  reconcile:
    needs: [plan, pull-account-year]
    # A 106-job serial matrix means a single rotating-historical re-pull
    # hitting a transient per-download cap (e.g. usda/nifa-research-education
    # FY2019 on 2026-09-19, ed/ies FY2018 in run 34141166514) otherwise skips
    # reconcile entirely and the whole weekly pass commits nothing, even
    # though the already-committed historical partition is untouched and
    # loses no data. Only the current fiscal year's atomic all-or-nothing
    # contract is load-bearing (the freshness SLA and
    # --require-current-provenance below already fail this job if a
    # current-FY partition is missing or stale), so reconcile now runs
    # whenever planning succeeded, regardless of individual pull-job
    # failures; the missing-partitions step and reconcile script below
    # enforce the current-FY guarantee explicitly instead of relying on the
    # matrix job dependency. See docs/obligation-ledger.md, "Refresh,
    # freshness, and publication".
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync the candidate workspace to the branch tip
        run: git pull --ff-only origin "$BRANCH"
      - uses: actions/download-artifact@v4
        with:
          pattern: obligation-partition-*
          path: _partitions
          if-no-files-found: warn
      - name: Detect account-years missing from this run's partitions
        env:
          PLAN_MATRIX: ${{ needs.plan.outputs.matrix }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          # A failed pull-account-year job uploads no partition artifact for
          # its account-year (the upload step never runs after the pull
          # step fails). Compare the planned matrix against what actually
          # landed in _partitions and hand the gap to
          # reconcile_obligation_artifacts.py, which enforces the
          # current-FY-is-mandatory / rotating-historical-is-tolerated
          # distinction.
          plan = json.loads(os.environ["PLAN_MATRIX"])
          staging = Path("_partitions")
          missing = []
          for job in plan["include"]:
              directory = staging / (
                  f"obligation-partition-{job['artifact']}-FY{job['fiscalYear']}"
              )
              if not directory.is_dir() or not any(directory.iterdir()):
                  missing.append(job)
                  print(
                      f"MISSING partition: {job['account']} FY{job['fiscalYear']} "
                      f"(purpose={job['purpose']})"
                  )
          Path("_missing_partitions.json").write_text(json.dumps(missing))
          print(
              f"{len(missing)} of {len(plan['include'])} planned account-years "
              "have no partition from this run"
          )
      - name: Reconcile every account into one candidate snapshot
        run: >-
          python scripts/reconcile_obligation_artifacts.py --staging _partitions
          --plan _missing_partitions.json
      - name: Validate all account stores, baselines, provenance, freshness, and dashboards
        # --check-freshness/--require-current-provenance are a temporal SLA
        # gate meaningful only right after a live pull (a submission-age
        # window, an "is this partition's provenance current" check); they
        # are not a universal-across-agencies invariant, so they stay a
        # direct scripts/validate_obligations.py call rather than a
        # scripts/verify.py tier. See docs/verification-regime.md.
        #
        # Independent publication gate (Phase 3.2d remediation, W2): this
        # call (require_data=True by construction -- no --allow-empty) is
        # this job's entire offline-validator gate; it replaces the full
        # `scripts/verify.py` default-tier step that used to run here. That
        # tier also ran the NIH award-ledger's offline validator and its own
        # unit modules, which gated obligation-ledger publication on the
        # award ledger's unrelated NIH source-current churn -- a different
        # ledger with its own release process (update-data.yml's rollup
        # job). See docs/verification-regime.md, "Workflow-to-gate mapping",
        # and the HIGH-2 finding in
        # docs/reviews/2026-09-15-phase-3.2d-independent-review.md.
        run: >-
          python scripts/validate_obligations.py
          --check-freshness --require-current-provenance
      - name: Run obligation ledger unit tests
        run: >-
          python -m unittest
          tests.test_obligation_aggregation
          tests.test_obligation_planner
          tests.test_obligation_reconcile
          tests.test_obligation_retry_approved_semantics
          tests.test_obligation_retry_recovery
          tests.test_obligation_store
          tests.test_obligation_validation
          tests.test_obligations_commerce
          tests.test_obligations_dod
          tests.test_obligations_doe
          tests.test_obligations_earth_ag
          tests.test_obligations_nasa
          tests.test_obligations_nsf
          tests.test_obligations_other_civilian
          tests.test_usaspending_obligations
          tests.test_verification_regime
          tests.test_pages_footprint
          -v
      - name: Validate award-ledger invariants shared with the obligation dashboards
        run: python scripts/validate_award_invariants.py
      - name: Verify — rendered tier (obligation, all-accounts, and sentinel browser matrices)
        run: python scripts/verify.py --tier rendered --json _verify-rendered.json
      - name: Commit the validated atomic snapshot
        shell: python
        run: |
          import json, os, subprocess

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email",
                          "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          config = json.load(open("config/obligation_accounts.json"))
          paths = ["data/obligations", "data/sentinel"] + [
              row["baseline"] for row in config["accounts"]
          ]
          subprocess.run(["git", "add", *paths], check=True)
          if subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode == 0:
              print("No obligation snapshot changes.")
          else:
              subprocess.run(["git", "commit", "-m",
                              "Refresh obligation ledger atomic snapshot [skip ci]"], check=True)
              branch = os.environ["BRANCH"]
              # Data commits land on main continuously (award leaf jobs, the
              # coordinator); replay this commit on top of the branch tip
              # instead of failing the whole run on a non-fast-forward push.
              # -X theirs keeps this job's freshly generated files on conflict.
              for attempt in range(5):
                  if subprocess.run(["git", "push", "origin", f"HEAD:{branch}"]).returncode == 0:
                      break
                  subprocess.run(["git", "pull", "--rebase", "-X", "theirs", "origin", branch],
                                 check=True)
              else:
                  raise SystemExit("push failed after 5 rebase attempts")
      - name: Assemble the exact validated Pages snapshot
        if: github.ref_name == 'main'
        run: python scripts/assemble_pages_site.py --output _site
      - name: Check GitHub Pages footprint (warn at 850 MB; stop at 950 MB)
        if: github.ref_name == 'main'
        run: >-
          python scripts/check_pages_footprint.py
          --site-root _site --json _pages-footprint.json
      - name: Upload the exact validated Pages snapshot
        if: github.ref_name == 'main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: reconcile
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publish the validated obligation snapshot
        id: deployment
        uses: actions/deploy-pages@v4
